[package]
name = "open-ndinb"
version = "0.1.0"
edition = "2021"
description = "OPEN-NDINB: DeckLink / webcam / video file -> NVIDIA Maxine AI Green Screen -> NDI (alpha + original)"
license = "MIT"
repository = "https://github.com/sungjin031293-source/OPEN-NDINB"
readme = "README.md"
keywords = ["ndi", "background-removal", "nvidia-maxine", "decklink", "streaming"]
default-run = "OPEN-NDINB"

[[bin]]
name = "OPEN-NDINB"
path = "src/main.rs"

[[bin]]
name = "ndi-probe"
path = "src/bin/ndi-probe.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
libloading = "0.9"
serde_json = "1"
png = "0.18"
rfd = { version = "0.18", default-features = false }
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_MediaFoundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
cc = "1"
winresource = "0.1"
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
